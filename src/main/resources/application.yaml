spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/worldcup
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNpZ25pbmcta2V5LWNoYW5nZS1tZS1wbGVhc2U=}
  expiration: 86400000

ml:
  api:
    base-url: http://localhost:8000
    timeout: 5000

simulation:
  optimization:
    benchmark-iterations: 100
    tournament-benchmark-iterations: 3
    analytics-cache-duration-ms: 60000
    cache-duration-ms: 60000
    metrics-retention: 1000

manager:
  progression:
    win-experience: 30
    draw-experience: 10
    knockout-experience: 40
    final-experience: 100
    tournament-victory-experience: 250
    award-experience: 25
    experience-per-level: 100

logging:
  level:
    org.springframework.security: DEBUG
