services:
  backend:
    build:
      context: .
    container_name: worldcup-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/worldcup
      # Development-only default fallbacks. Must be overridden with secure values in production.
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLXNhbXBsZS1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQ=}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - worldcup_net

  frontend:
    build:
      context: ./frontend
    container_name: worldcup-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - worldcup_net

  postgres:
    image: postgres:16
    container_name: worldcup-postgres
    environment:
      POSTGRES_DB: worldcup
      # Development-only default fallbacks. Must be overridden with secure values in production.
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d worldcup"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worldcup_net

volumes:
  postgres_data:

networks:
  worldcup_net:
    driver: bridge
