apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "worldcup.fullname" . }}-config
data:
  # Internal postgres DNS within the cluster
  DB_URL: "jdbc:postgresql://{{ include "worldcup.fullname" . }}-postgres:5432/worldcup"
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | quote }}
