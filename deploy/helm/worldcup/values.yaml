# Default values for worldcup.

backend:
  replicaCount: 1
  image:
    repository: worldcup-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 1024Mi
    # requests:
    #   cpu: 500m
    #   memory: 512Mi
  env:
    CORS_ALLOWED_ORIGINS: "http://localhost:5173"

frontend:
  replicaCount: 1
  image:
    repository: worldcup-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources: {}

secret:
  # Do not store production secrets here! Replace via CI/CD for deployments.
  dbUsername: "admin"
  dbPassword: "admin123"
  jwtSecret: "bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNpZ25pbmcta2V5LWNoYW5nZS1tZS1wbGVhc2U="
